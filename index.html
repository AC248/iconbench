<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" href="favicon.png">
<title>图标台 ICONBENCH</title>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --paper:#F4F3EE; --panel:#FFFFFF; --panel-2:#FAF9F5; --panel-3:#EFEDE6;
  --ink:#1A1917; --ink-2:#4C4941; --muted:#8A8579;
  --line:#E3E0D7; --line-2:#CFCBBE;
  --accent:#BE4429; --accent-soft:#F8EAE5;
  --ok:#3C7A5D; --warn:#A97518;
  --r:9px; --r-sm:6px;
  --t:200ms cubic-bezier(.2,.72,.2,1);
  --t2:340ms cubic-bezier(.16,.86,.3,1);
  --sh:0 1px 1px rgba(26,25,23,.04),0 10px 26px -16px rgba(26,25,23,.35);
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
html[data-theme="dark"]{
  --paper:#131311; --panel:#1C1C19; --panel-2:#222220; --panel-3:#2A2A26;
  --ink:#EDEAE2; --ink-2:#B9B5AA; --muted:#8A857A;
  --line:#2F2E29; --line-2:#454338;
  --accent:#DE6949; --accent-soft:#2C1E19;
  --ok:#61A585; --warn:#CFA04A;
  --sh:0 1px 1px rgba(0,0,0,.4),0 14px 34px -18px rgba(0,0,0,.85);
}
html,body{height:100%}
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",Roboto,sans-serif;
  font-size:14px; line-height:1.5; -webkit-font-smoothing:antialiased;
  transition:background var(--t2),color var(--t2);
  padding-bottom:env(safe-area-inset-bottom);
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:none;padding:0}
::selection{background:var(--accent);color:#fff}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lab{font-size:10.5px;letter-spacing:.11em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* ---------- scaffold ---------- */
.wrap{max-width:1240px;margin:0 auto;padding:0 20px 120px}

/* ---------- topbar ---------- */
.topbar{position:sticky;top:0;z-index:40;background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px);
  border-bottom:1px solid var(--line);transition:border-color var(--t2),background var(--t2)}
.topin{max-width:1240px;margin:0 auto;padding:11px 20px;display:flex;align-items:center;gap:14px}
.brand{display:flex;align-items:center;gap:9px;flex-shrink:0}
.mark{width:26px;height:26px;border:1.4px solid var(--ink);border-radius:7px;display:grid;place-items:center;
  transition:transform var(--t2),border-color var(--t2),background var(--t)}
.brand:hover .mark{transform:rotate(-90deg);background:var(--ink)}
.brand:hover .mark svg{stroke:var(--paper)}
.mark svg{stroke:var(--ink);transition:stroke var(--t)}
.bname{font-weight:700;font-size:13.5px;letter-spacing:.14em;line-height:1}
.bsub{font-size:10px;letter-spacing:.06em;color:var(--muted);line-height:1;margin-top:3px}
.search{flex:1;position:relative;min-width:0;max-width:420px}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);stroke:var(--muted);pointer-events:none;transition:stroke var(--t)}
.search input{width:100%;height:38px;padding:0 34px 0 34px;background:var(--panel);border:1px solid var(--line);
  border-radius:var(--r);font-size:16px;outline:none;transition:border-color var(--t),box-shadow var(--t),background var(--t2)}
.search input::placeholder{color:var(--muted);font-size:13.5px}
.search input:focus{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 8%,transparent)}
.search:focus-within svg{stroke:var(--ink)}
.kbd{position:absolute;right:9px;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:10px;
  color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:1px 5px;transition:opacity var(--t)}
.search:focus-within .kbd{opacity:0}
.tacts{display:flex;align-items:center;gap:7px;margin-left:auto}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:38px;padding:0 13px;
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);font-size:13px;font-weight:500;
  transition:border-color var(--t),background var(--t),transform var(--t),color var(--t);white-space:nowrap}
.btn:hover{border-color:var(--line-2);background:var(--panel-2)}
.btn:active{transform:scale(.97)}
.btn svg{stroke:currentColor;flex-shrink:0}
.btn.ico{width:38px;padding:0}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn.pri:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.btn.sm{height:32px;padding:0 10px;font-size:12.5px}
.btn.sm.ico{width:32px}
.btn[disabled]{opacity:.4;pointer-events:none}

/* ---------- backup strip ---------- */
.bstrip{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:12px 0 0}
.bstrip .lab{margin-right:2px}
.meter{display:flex;align-items:center;gap:8px;margin-left:auto;font-size:11.5px;color:var(--muted)}
.mbar{width:88px;height:4px;border-radius:99px;background:var(--panel-3);overflow:hidden}
.mbar i{display:block;height:100%;width:0;background:var(--ink);border-radius:99px;transition:width var(--t2),background var(--t)}
.mbar i.hi{background:var(--accent)}

.nudge{display:none;align-items:center;gap:9px;margin-top:12px;padding:9px 13px;border-radius:var(--r);
  background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);
  font-size:12.5px;color:var(--accent);animation:slidein var(--t2) both}
.nudge.on{display:flex}
.nudge button{margin-left:auto;font-size:12px;text-decoration:underline;color:inherit;opacity:.8}

/* ---------- toolbar ---------- */
.toolbar{display:flex;align-items:center;gap:8px;margin:22px 0 14px;flex-wrap:wrap}
.chips{display:flex;gap:6px;flex-wrap:wrap;min-width:0}
.chip{height:30px;padding:0 12px;border:1px solid var(--line);border-radius:99px;background:var(--panel);
  font-size:12.5px;color:var(--ink-2);display:inline-flex;align-items:center;gap:6px;
  transition:background var(--t),color var(--t),border-color var(--t),transform var(--t)}
.chip:hover{border-color:var(--line-2)}
.chip:active{transform:scale(.95)}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip b{font-family:var(--mono);font-size:10.5px;opacity:.6;font-weight:500}
.chip.addcat{border-style:dashed;border-color:var(--line-2);color:var(--muted)}
.chip.addcat:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.chip.addcat svg{stroke:currentColor}
.chip.usercat .chip-del{width:15px;height:15px;display:flex;align-items:center;justify-content:center;border-radius:99px;font-size:14px;line-height:1;margin-left:-2px;margin-right:-4px;transition:background var(--t),color var(--t)}
.chip.usercat .chip-del:hover{background:var(--accent);color:#fff}
.tspace{margin-left:auto;display:flex;align-items:center;gap:7px}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--panel)}
.seg button{width:34px;height:32px;display:grid;place-items:center;transition:background var(--t),color var(--t)}
.seg button svg{stroke:var(--muted);transition:stroke var(--t)}
.seg button.on{background:var(--ink)}
.seg button.on svg{stroke:var(--paper)}
/* custom dropdown (replaces native select) */
.dropdown{position:relative;display:inline-block;min-width:0}
.ddBtn{height:34px;display:flex;align-items:center;gap:6px;padding:0 28px 0 11px;position:relative;
  border:1px solid var(--line);border-radius:var(--r);background:var(--panel);
  font-size:13px;color:var(--ink);cursor:pointer;white-space:nowrap;
  transition:border-color var(--t),background var(--t);outline:none}
.ddBtn:hover{border-color:var(--line-2);background:var(--panel-2)}
.ddBtn::after{content:'';position:absolute;right:10px;top:50%;transform:translateY(-50%);
  border-left:4px solid transparent;border-right:4px solid transparent;
  border-top:5px solid var(--muted);pointer-events:none;transition:border-top-color var(--t)}
.ddBtn.open{border-color:var(--ink)}
.ddBtn.open::after{border-top-color:var(--ink)}
.ddMenu{position:absolute;top:calc(100%+4px);left:0;min-width:100%;z-index:35;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  box-shadow:var(--sh);padding:4px;
  opacity:0;transform:translateY(-6px);pointer-events:none;
  transition:opacity var(--t),transform var(--t)}
.ddMenu.on{opacity:1;transform:none;pointer-events:auto}
.ddMenu button{display:block;width:100%;text-align:left;padding:7px 11px;border:none;
  background:none;font-size:13px;color:var(--ink-2);border-radius:var(--r-sm);
  cursor:pointer;transition:background var(--t),color var(--t);white-space:nowrap}
.ddMenu button:hover{background:var(--panel-3);color:var(--ink)}
.ddMenu button.on{color:var(--accent);font-weight:600;background:var(--accent-soft)}
.ddWide{width:100%}.ddWide .ddBtn{width:100%;justify-content:flex-start}
.tspace{margin-left:auto;display:flex;align-items:center;gap:7px}

/* ---------- selection bar ---------- */
.selbar{position:fixed;left:50%;bottom:22px;transform:translate(-50%,140%);z-index:60;
  display:flex;align-items:center;gap:8px;padding:9px 10px 9px 16px;border-radius:14px;
  background:var(--ink);color:var(--paper);box-shadow:0 18px 44px -18px rgba(0,0,0,.6);
  transition:transform var(--t2);max-width:calc(100vw - 24px);flex-wrap:wrap;justify-content:center;
  margin-bottom:env(safe-area-inset-bottom)}
.selbar.on{transform:translate(-50%,0)}
.selbar .n{font-family:var(--mono);font-size:12.5px;opacity:.75;margin-right:4px}
.selbar button{height:34px;padding:0 11px;border-radius:8px;font-size:12.5px;display:inline-flex;align-items:center;gap:5px;
  background:color-mix(in srgb,var(--paper) 12%,transparent);transition:background var(--t),transform var(--t)}
.selbar button:hover{background:color-mix(in srgb,var(--paper) 24%,transparent)}
.selbar button:active{transform:scale(.95)}
.selbar button svg{stroke:currentColor}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(126px,1fr));gap:10px}
.card{position:relative;border:1px solid var(--line);border-radius:11px;background:var(--panel);
  padding:16px 10px 10px;display:flex;flex-direction:column;align-items:center;gap:9px;overflow:hidden;
  transition:border-color var(--t),transform var(--t),box-shadow var(--t),background var(--t2);
  animation:pop var(--t2) both;animation-delay:calc(var(--i)*14ms)}
.card::after{content:"";position:absolute;inset:0;border-radius:11px;pointer-events:none;
  box-shadow:inset 0 0 0 0 var(--ink);transition:box-shadow var(--t)}
.card:hover{transform:translateY(-2px);box-shadow:var(--sh);border-color:var(--line-2)}
.card.sel{border-color:var(--ink)}
.card.sel::after{box-shadow:inset 0 0 0 1px var(--ink)}
.glyph{display:grid;place-items:center;color:var(--ink);transition:transform var(--t2),color var(--t2);height:52px}
.glyph svg{display:block;transition:width var(--t2),height var(--t2)}
.glyph img{display:block;object-fit:contain}
.card:hover .glyph{transform:scale(1.09)}
.cname{font-size:12px;text-align:center;width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  color:var(--ink-2);transition:color var(--t)}
.card:hover .cname{color:var(--ink)}
.cmeta{font-family:var(--mono);font-size:9.5px;color:var(--muted);letter-spacing:.05em;text-transform:uppercase}
.cact{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:3px;padding:6px;
  background:linear-gradient(to top,var(--panel) 62%,transparent);
  transform:translateY(110%);opacity:0;transition:transform var(--t),opacity var(--t)}
.card:hover .cact,.card:focus-within .cact,.card.sel .cact{transform:translateY(0);opacity:1}
.cact button{width:29px;height:29px;display:grid;place-items:center;border-radius:7px;border:1px solid var(--line);
  background:var(--panel);transition:background var(--t),border-color var(--t),transform var(--t)}
.cact button svg{stroke:var(--ink-2);transition:stroke var(--t)}
.cact button:hover{background:var(--ink);border-color:var(--ink)}
.cact button:hover svg{stroke:var(--paper)}
.cact button:active{transform:scale(.9)}
.cact button[data-action="sel"] .chk-mark{stroke:var(--paper);stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset var(--t2)}
.card.sel .cact button[data-action="sel"]{background:var(--ink);border-color:var(--ink)}
.card.sel .cact button[data-action="sel"] svg{stroke:var(--paper)}
.card.sel .cact button[data-action="sel"] .chk-mark{stroke-dashoffset:0}
.fav{position:absolute;right:7px;top:7px;width:18px;height:18px;display:grid;place-items:center;opacity:0;transition:opacity var(--t),transform var(--t)}
.fav svg{stroke:var(--muted);fill:none;transition:stroke var(--t),fill var(--t),transform var(--t)}
.card:hover .fav{opacity:1}
.card .fav.on{opacity:1}
.fav.on svg{stroke:var(--warn);fill:var(--warn)}
.fav:active svg{transform:scale(.8)}
#efav svg{stroke:var(--muted);fill:none;transition:stroke var(--t),fill var(--t),transform var(--t)}
#efav.on svg{stroke:var(--warn);fill:var(--warn)}
#efav:active svg{transform:scale(.85)}

/* list view */
.grid.list{grid-template-columns:1fr;gap:0;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel)}
.grid.list .card{flex-direction:row;align-items:center;border:none;border-bottom:1px solid var(--line);border-radius:0;
  padding:9px 14px 9px 40px;gap:14px;transform:none!important}
.grid.list .card:last-child{border-bottom:none}
.grid.list .card:hover{background:var(--panel-2);box-shadow:none}
.grid.list .card::after{border-radius:0}
.grid.list .glyph{height:auto;width:30px}
.grid.list .cname{text-align:left;flex:1;font-size:13.5px}
.grid.list .cmeta{margin-left:auto}
.grid.list .cact{position:static;transform:none;opacity:0;padding:0;background:none;width:auto}
.grid.list .card:hover .cact{opacity:1}
.grid.list .cact{position:static;transform:none;opacity:0;padding:0;background:none;width:auto}
.grid.list .card:hover .cact,.grid.list .card.sel .cact{opacity:1}
.grid.list .fav{position:static;order:9}

.empty{text-align:center;padding:70px 20px;color:var(--muted);animation:pop var(--t2) both}
.empty svg{stroke:var(--line-2);margin-bottom:14px}
.empty p{margin:0 0 4px;font-size:14px;color:var(--ink-2)}
.empty span{font-size:12.5px}

@keyframes pop{from{opacity:0;transform:translateY(9px) scale(.97)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:none}}
/* ---------- scrim / drawer / modal ---------- */
.scrim{position:fixed;inset:0;z-index:70;background:rgba(20,19,17,0);backdrop-filter:blur(0px);
  opacity:0;pointer-events:none;transition:opacity var(--t2),background var(--t2),backdrop-filter var(--t2)}
.scrim.on{opacity:1;pointer-events:auto;background:rgba(20,19,17,.42);backdrop-filter:blur(3px)}

.drawer{position:fixed;top:0;right:0;bottom:0;width:392px;max-width:100vw;z-index:80;background:var(--panel);
  border-left:1px solid var(--line);display:flex;flex-direction:column;
  transform:translateX(101%);transition:transform var(--t2);box-shadow:-24px 0 60px -30px rgba(0,0,0,.5)}
.drawer.on{transform:none}
.dhead{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line);flex-shrink:0}
.dbody{flex:1;overflow:auto;padding:18px 16px 26px;overscroll-behavior:contain}
.dfoot{border-top:1px solid var(--line);padding:12px 16px;display:flex;gap:8px;flex-wrap:wrap;flex-shrink:0;
  padding-bottom:calc(12px + env(safe-area-inset-bottom))}

.stage{border:1px solid var(--line);border-radius:12px;padding:22px 16px 14px;display:flex;flex-direction:column;
  align-items:center;gap:16px;background-color:var(--panel-2);
  background-image:linear-gradient(45deg,var(--panel-3) 25%,transparent 25%),linear-gradient(-45deg,var(--panel-3) 25%,transparent 25%),linear-gradient(45deg,transparent 75%,var(--panel-3) 75%),linear-gradient(-45deg,transparent 75%,var(--panel-3) 75%);
  background-size:14px 14px;background-position:0 0,0 7px,7px -7px,-7px 0;transition:background-color var(--t2)}
.stagemain{display:grid;place-items:center;min-height:78px;color:var(--ink);transition:color var(--t2)}
.sizes{display:flex;align-items:flex-end;gap:16px;padding-top:12px;border-top:1px dashed var(--line-2);width:100%;justify-content:center}
.szitem{display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink);transition:opacity var(--t)}
.szitem span{font-family:var(--mono);font-size:9.5px;color:var(--muted)}
.szitem i{display:grid;place-items:center}

.fld{margin-top:18px}
.fld>label{display:block;margin-bottom:7px}
.inp{width:100%;height:40px;padding:0 12px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  font-size:16px;outline:none;transition:border-color var(--t),box-shadow var(--t)}
.inp:focus{border-color:var(--ink);box-shadow:0 0 0 3px color-mix(in srgb,var(--ink) 8%,transparent)}
textarea.inp{height:auto;min-height:112px;padding:11px 12px;resize:vertical;font-family:var(--mono);font-size:12.5px;line-height:1.6}
.row2{display:flex;gap:8px}
.row2>*{flex:1;min-width:0}

.swatches{display:flex;gap:7px;flex-wrap:wrap;align-items:center}
.sw{width:28px;height:28px;border-radius:8px;border:1px solid var(--line-2);position:relative;
  transition:transform var(--t),box-shadow var(--t)}
.sw:hover{transform:scale(1.12)}
.sw.on{box-shadow:0 0 0 2px var(--panel),0 0 0 3.6px var(--ink)}
.sw.auto{background:linear-gradient(135deg,var(--ink) 50%,var(--paper) 50%)}
.sw.custom{display:grid;place-items:center;overflow:hidden;background:var(--panel-2)}
.sw.custom input{position:absolute;inset:-8px;opacity:0;cursor:pointer}
.sw.custom svg{stroke:var(--muted)}

.rangewrap{display:flex;align-items:center;gap:11px}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:22px;background:transparent;outline:none}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:var(--line-2);border-radius:99px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:99px;background:var(--ink);
  margin-top:-6.5px;border:2px solid var(--panel);box-shadow:0 1px 4px rgba(0,0,0,.28);transition:transform var(--t)}
input[type=range]:active::-webkit-slider-thumb{transform:scale(1.25)}
input[type=range]::-moz-range-track{height:3px;background:var(--line-2);border-radius:99px}
input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:99px;background:var(--ink);border:2px solid var(--panel)}
.rval{font-family:var(--mono);font-size:12px;color:var(--muted);min-width:34px;text-align:right}

.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.tag{display:inline-flex;align-items:center;gap:5px;height:26px;padding:0 6px 0 10px;border-radius:99px;
  background:var(--panel-3);font-size:12px;color:var(--ink-2);animation:pop 200ms both}
.tag button{width:16px;height:16px;display:grid;place-items:center;border-radius:99px;transition:background var(--t)}
.tag button:hover{background:var(--line-2)}
.tag button svg{stroke:var(--ink-2)}

/* modal */
.modal{position:fixed;inset:0;z-index:90;display:grid;place-items:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity var(--t2)}
.modal.on{opacity:1;pointer-events:auto}
.mback{position:absolute;inset:0;background:rgba(20,19,17,.46);backdrop-filter:blur(3px)}
.mbox{position:relative;width:100%;max-width:540px;max-height:calc(100vh - 40px);display:flex;flex-direction:column;
  background:var(--panel);border:1px solid var(--line);border-radius:15px;box-shadow:0 30px 70px -28px rgba(0,0,0,.6);
  transform:scale(.955) translateY(10px);opacity:0;transition:transform var(--t2),opacity var(--t2)}
.modal.on .mbox{transform:none;opacity:1}
.mhead{display:flex;align-items:center;gap:10px;padding:15px 17px;border-bottom:1px solid var(--line);flex-shrink:0}
.mtitle{font-weight:650;font-size:14.5px}
.mbody{padding:17px;overflow:auto;flex:1;overscroll-behavior:contain}
.mfoot{padding:13px 17px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-shrink:0;flex-wrap:wrap}

/* dropzone */
.dz{border:1.6px dashed var(--line-2);border-radius:12px;padding:32px 18px;text-align:center;background:var(--panel-2);
  transition:border-color var(--t),background var(--t),transform var(--t)}
.dz.hot{border-color:var(--accent);background:var(--accent-soft);transform:scale(1.014)}
.dz svg{stroke:var(--muted);transition:stroke var(--t),transform var(--t2)}
.dz.hot svg{stroke:var(--accent);transform:translateY(-4px)}
.dz p{margin:12px 0 3px;font-size:14px;font-weight:550}
.dz span{font-size:12px;color:var(--muted)}
.dz .btn{margin-top:14px}
.hr{display:flex;align-items:center;gap:10px;margin:18px 0;color:var(--muted);font-size:11px;letter-spacing:.1em}
.hr::before,.hr::after{content:"";flex:1;height:1px;background:var(--line)}

.dropveil{position:fixed;inset:0;z-index:120;display:grid;place-items:center;pointer-events:none;
  background:color-mix(in srgb,var(--paper) 82%,transparent);backdrop-filter:blur(5px);
  opacity:0;transition:opacity var(--t)}
.dropveil.on{opacity:1}
.dropveil .box{border:2px dashed var(--accent);border-radius:18px;padding:44px 60px;text-align:center;color:var(--accent);
  transform:scale(.96);transition:transform var(--t2);background:var(--panel)}
.dropveil.on .box{transform:none}
.dropveil p{margin:12px 0 0;font-weight:600;font-size:15px}

/* tabs */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin-bottom:15px;position:relative;overflow-x:auto}
.tabs button{padding:9px 12px;font-size:13px;color:var(--muted);white-space:nowrap;transition:color var(--t)}
.tabs button.on{color:var(--ink);font-weight:600}
.tabs .ink{position:absolute;bottom:-1px;height:2px;background:var(--ink);border-radius:2px;
  transition:transform var(--t2),width var(--t2);left:0}
.code{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:12px;
  font-family:var(--mono);font-size:12px;line-height:1.65;white-space:pre-wrap;word-break:break-all;
  max-height:210px;overflow:auto;color:var(--ink-2)}

/* toast */
.toasts{position:fixed;left:50%;top:16px;transform:translateX(-50%);z-index:140;display:flex;flex-direction:column;gap:8px;
  align-items:center;pointer-events:none;width:max-content;max-width:calc(100vw - 32px)}
.toast{display:flex;align-items:center;gap:9px;padding:9px 15px;border-radius:99px;background:var(--ink);color:var(--paper);
  font-size:13px;box-shadow:0 12px 30px -14px rgba(0,0,0,.6);animation:tin var(--t2) both}
.toast.out{animation:tout 240ms both}
.toast svg{stroke:currentColor;flex-shrink:0}
.toast.err{background:var(--accent);color:#fff}
@keyframes tin{from{opacity:0;transform:translateY(-14px) scale(.95)}to{opacity:1;transform:none}}
@keyframes tout{to{opacity:0;transform:translateY(-10px) scale(.96)}}

.copied svg.a{display:none}
.copied svg.b{display:block!important}
svg.b{display:none;animation:pop 200ms both}

.foot{text-align:center;color:var(--muted);font-size:11.5px;padding:34px 0 0;line-height:1.9}
.foot b{font-weight:600;color:var(--ink-2)}

/* ---------- mobile ---------- */
@media (max-width:820px){
  .drawer{width:100%;top:auto;height:88vh;border-left:none;border-top:1px solid var(--line);
    border-radius:18px 18px 0 0;transform:translateY(101%)}
  .drawer.on{transform:none}
}
@media (max-width:700px){
  .wrap{padding:0 13px 130px}
  .topin{padding:9px 13px;gap:9px;flex-wrap:wrap}
  .brand{order:1}
  .tacts{order:2;margin-left:auto}
  .search{order:3;flex-basis:100%;max-width:none}
  .search input{height:42px}
  .kbd{display:none}
  .bstrip .btn{flex:1;min-width:calc(50% - 5px);height:44px}
  .bstrip .lab{flex-basis:100%;margin-bottom:-4px}
  .meter{margin-left:0;flex-basis:100%;justify-content:flex-end}
  .grid{grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
  .card{padding:14px 6px 8px}
  .cact{position:static;transform:none;opacity:1;background:none;padding:2px 0 0}
  .cact button{width:32px;height:32px}
  .fav{opacity:1}
  .grid.list .cact{opacity:1}
  .toolbar{gap:7px}
  .tspace{width:100%;margin-left:0}
  .tspace .dropdown{flex:1}
  .btn{height:40px}
  .btn.ico{width:40px}
  .selbar{left:12px;right:12px;bottom:12px;transform:translateY(160%);max-width:none;padding:9px}
  .selbar.on{transform:none}
  .selbar .n{width:100%;text-align:center;margin:0 0 2px}
  .selbar button{flex:1;justify-content:center;height:42px}
  .mbox{max-height:calc(100vh - 24px)}
  .mfoot .btn{flex:1;height:44px}
  .dfoot .btn{flex:1;min-width:calc(50% - 4px);height:44px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-delay:0ms!important;transition-duration:.01ms!important}
}

<script>
(function(){
/* ========== SVG helpers ========== */
// All SVG processing uses DOMParser in image/svg+xml mode to ensure proper namespace,
// and serializes back to string. This is more reliable than HTML div.innerHTML for SVG.
const SVGI = {
  parse(rawSvg){
    let s=(rawSvg||'').trim();
    if(!s)return null;
    if(!/xmlns\s*=\s*["']http:\/\/www\.w3\.org\/2000\/svg/i.test(s)){
      s=s.replace(/^(<svg\b)/i,'$1 xmlns="http://www.w3.org/2000/svg"');
    }
    let doc=new DOMParser().parseFromString(s,'image/svg+xml');
    let e=doc.documentElement;
    if(!e||e.tagName!=='svg'||e.getElementsByTagName('parsererror').length)return null;
    e.querySelectorAll('script,foreignObject').forEach(n=>n.remove());
    let all=e.getElementsByTagName('*');
    for(let n of all){
      for(let a of[...n.attributes]){if(a.name.toLowerCase().startsWith('on'))n.removeAttribute(a.name)}
    }
    if(!e.getAttribute('viewBox')){
      let w=e.getAttribute('width')||'24',h=e.getAttribute('height')||'24';
      e.setAttribute('viewBox','0 0 '+parseFloat(w)+' '+parseFloat(h));
    }
    e.removeAttribute('width');e.removeAttribute('height');
    return e
  },

  toString(svgEl){
    try{return new XMLSerializer().serializeToString(svgEl)}
    catch(e){return svgEl.outerHTML||''}
  },

  isStroke(svgEl){
    let ct=0,cf=0;
    function w(n){
      if(n.nodeType!==1)return;
      let f=n.getAttribute('fill'),s=n.getAttribute('stroke');
      if(s&&s!=='none')ct++;
      if(f&&f!=='none')cf++;
      for(let c of n.children)w(c)
    }
    w(svgEl);
    return ct>=cf
  },

  // Render SVG with optional color/strokeWidth override, return string.
  // Handles three cases that broke previous versions:
  // 1) Stroke icons where SVG root has fill="none" but no stroke attribute (children inherit 'none' → invisible)
  // 2) Mixed icons with some explicit fills/strokes
  // 3) Icons with currentColor references
  build(rawSvg, options){
    // options: {color: '#xxx'|null, strokeWidth: number|null, w: number, h: number, defaultInk: '#xxx'}
    let el=this.parse(rawSvg);
    if(!el)return null;
    let userColor=(options.color&&options.color!=='currentColor')?options.color:null;
    let defaultInk=options.defaultInk||'#1A1917';
    let sw=options.strokeWidth;
    // Detect stroke icon: root fill='none' and root stroke missing/'none'
    let rootFill=el.getAttribute('fill');
    let rootStroke=el.getAttribute('stroke');
    let isStrokeIcon=(rootFill==='none')&&(rootStroke===null||rootStroke==='none');
    // Effective stroke color: user override > currentColor (inherits from container)
    let strokeColor=userColor||'currentColor';
    // Walk and patch
    function w(n){
      if(n.nodeType!==1)return;
      let f=n.getAttribute('fill'),s=n.getAttribute('stroke');
      // Apply user color to explicit fill/stroke
      if(userColor){
        if(f!==null&&f!=='none'&&f!=='currentColor')n.setAttribute('fill',userColor);
        if(s!==null&&s!=='none'&&s!=='currentColor')n.setAttribute('stroke',userColor);
      }
      // Apply stroke-width override to elements that have stroke (or will inherit)
      if(sw!==undefined&&sw!==null){
        if(s!==null&&s!=='none'){
          n.setAttribute('stroke-width',String(sw));
        }else if(isStrokeIcon){
          if(n!==el)n.setAttribute('stroke-width',String(sw));
        }
      }
      for(let c of n.children)w(c)
    }
    w(el);
    // For stroke icons missing root stroke, add it explicitly so children inherit
    if(isStrokeIcon){
      el.setAttribute('stroke',strokeColor);
      if(sw!==undefined&&sw!==null)el.setAttribute('stroke-width',String(sw));
    }
    if(options.w!==undefined){el.setAttribute('width',String(options.w));el.setAttribute('height',String(options.h))}
    return this.toString(el)
  },

  defaultStrokeWidth(svgEl){
    function f(n){
      for(let a of n.attributes||[]){if(a.name==='stroke-width')return parseFloat(a.value)}
      for(let c of n.children||[]){let v=f(c);if(v!==null)return v}
      return null
    }
    let v=f(svgEl);
    return v!==null?v:1.6
  },

  toDataURL(svgStr){return 'data:image/svg+xml,'+encodeURIComponent(svgStr)},

  toPNG(svgStr, w, h){
    return new Promise((resolve, reject)=>{
      let url='data:image/svg+xml,'+encodeURIComponent(svgStr);
      let img=new Image();
      img.onload=()=>{
        let c=document.createElement('canvas');
        c.width=w;c.height=h;
        let ctx=c.getContext('2d');
        ctx.clearRect(0,0,w,h);
        ctx.drawImage(img,0,0,w,h);
        c.toBlob(b=>resolve(b),'image/png');
      };
      img.onerror=reject;
      img.src=url;
    })
  },

  parseFile(file){return new Promise((resolve,reject)=>{
    let r=new FileReader();r.onload=()=>resolve(r.result);r.onerror=reject;r.readAsText(file)
  })}
};

// Render icon for DOM display.
function buildSvgString(rawSvg, options){
  return SVGI.build(rawSvg, Object.assign({defaultInk:getComputedInk()},options||{}))
}

// Render icon for export/download — uses currentColor if no specific color set.
function buildSvgStringForExport(rawSvg, options){
  let opts=options||{};
  let color=opts.color;
  let useCurrent=!color||color==='currentColor';
  // When theme-following, use 'currentColor' as defaultInk so stroke icons export as currentColor
  let str=SVGI.build(rawSvg,{
    color: useCurrent ? null : color,
    strokeWidth: opts.strokeWidth,
    defaultInk: useCurrent ? 'currentColor' : '#1A1917'
  });
  return str
}

// Replaces localStorage for unlimited storage capacity (browser quota: tens to hundreds of MB).
// Auto-migrates existing localStorage data on first run.
const IDB=(function(){
  const NAME='IconbenchDB',VER=1;
  let _db=null;
  function open(){
    if(_db)return Promise.resolve(_db);
    return new Promise((resolve,reject)=>{
      let r=indexedDB.open(NAME,VER);
      r.onupgradeneeded=e=>{
        let d=e.target.result;
        if(!d.objectStoreNames.contains('icons'))d.createObjectStore('icons',{keyPath:'id'});
        if(!d.objectStoreNames.contains('meta'))d.createObjectStore('meta',{keyPath:'key'})
      };
      r.onsuccess=e=>{_db=e.target.result;_db.onclose=()=>{_db=null};resolve(_db)};
      r.onerror=e=>reject(e.target.error)
    })
  }
  return{
    async getAll(){let db=await open();return new Promise((resolve,reject)=>{
      let tx=db.transaction('icons','readonly'),r=tx.objectStore('icons').getAll();
      r.onsuccess=()=>resolve(r.result);r.onerror=e=>reject(e.target.error)
    })},
    async putAll(items){let db=await open();return new Promise((resolve,reject)=>{
      let tx=db.transaction('icons','readwrite'),s=tx.objectStore('icons');
      s.clear();items.forEach(i=>s.put(i));tx.oncomplete=()=>resolve();tx.onerror=e=>reject(e.target.error)
    })},
    async deleteAll(){let db=await open();return new Promise((resolve,reject)=>{
      let tx=db.transaction('icons','readwrite');tx.objectStore('icons').clear();
      tx.oncomplete=()=>resolve();tx.onerror=e=>reject(e.target.error)
    })},
    async count(){let db=await open();return new Promise((resolve,reject)=>{
      let tx=db.transaction('icons','readonly'),r=tx.objectStore('icons').count();
      r.onsuccess=()=>resolve(r.result);r.onerror=e=>reject(e.target.error)
    })},
    async getMeta(key){let db=await open();return new Promise((resolve,reject)=>{
      let tx=db.transaction('meta','readonly'),r=tx.objectStore('meta').get(key);
      r.onsuccess=()=>resolve(r.result?r.result.value:null);r.onerror=e=>reject(e.target.error)
    })},
    async setMeta(key,val){let db=await open();return new Promise((resolve,reject)=>{
      let tx=db.transaction('meta','readwrite'),s=tx.objectStore('meta');
      s.put({key,value:val});tx.oncomplete=()=>resolve();tx.onerror=e=>reject(e.target.error)
    })}
  }
})();

// Legacy key for migration
const STORAGE_KEY='wb_iconbench_data';

async function loadIcons(){
  // Try IndexedDB first
  try{let db=await IDB.getAll();if(db.length>0){icons=db;let t=await IDB.getMeta('theme');if(t)theme=t;
    let uc=await IDB.getMeta('userCats');if(uc&&Array.isArray(uc))userCats=uc;return}}catch(e){}
  // Fallback: migrate from localStorage
  try{let d=localStorage.getItem(STORAGE_KEY);if(d){let p=JSON.parse(d);icons=p.icons||[];theme=p.theme||'light';
    if(p.userCats)userCats=p.userCats;
    if(icons.length){IDB.putAll(icons).catch(()=>{});IDB.setMeta('theme',theme).catch(()=>{});if(userCats.length)IDB.setMeta('userCats',userCats).catch(()=>{});localStorage.removeItem(STORAGE_KEY);return}}
  }catch(e){}
  // Default samples
  icons=JSON.parse(JSON.stringify(SAMPLES))
}
function saveIcons(){
  IDB.putAll(icons).catch(e=>toast('保存失败：'+e.message,'err'));
  IDB.setMeta('theme',theme).catch(()=>{});
  IDB.setMeta('userCats',userCats).catch(()=>{});
  updateMeter()
}
async function updateMeter(){
  try{let c=await IDB.count();let el=document.getElementById('mtxt'),bar=document.getElementById('mbar');
    el.textContent=c+' 个图标';
    if(navigator.storage&&navigator.storage.estimate){
      let s=await navigator.storage.estimate();
      if(s.usage!==undefined&&s.quota){
        let pct=s.usage/s.quota*100,mb=(s.usage/1048576).toFixed(1),quota=(s.quota/1048576).toFixed(0);
        el.textContent=c+' 图标 / '+mb+' MB / '+quota+' MB';
        bar.style.width=Math.min(pct,100)+'%';
        bar.className=pct>80?'hi':'';
        if(pct>=90&&!sessionStorage.getItem('wb_full_warn')){
          sessionStorage.setItem('wb_full_warn','1');
          toast('浏览器存储已用 '+pct.toFixed(0)+'%，建议导出备份','err')
        }else if(pct<85){sessionStorage.removeItem('wb_full_warn')}
      }
    }
  }catch(e){}
  checkNudge()
}

function getSortedIcons(){
  let all=icons.filter(i=>{if(currentCat==='全部图标')return true;if(currentCat==='未分类')return!i.cat;return i.cat===currentCat});
  if(sortBy==='new')all.sort((a,b)=>b.ts-a.ts);
  else if(sortBy==='old')all.sort((a,b)=>a.ts-b.ts);
  else if(sortBy==='az')all.sort((a,b)=>(a.name||'').localeCompare(b.name||''));
  else if(sortBy==='fav')all.sort((a,b)=>(b.fav?1:0)-(a.fav?1:0)||b.ts-a.ts);
  return all
}

function renderGlyph(i,w,h){
  if(i.type==='raster')return`<img src="${escAttr(i.raw)}" width="${w}" height="${h}" style="object-fit:contain;border-radius:3px">`;
  let color=(i.color&&i.color!=='currentColor')?i.color:null;
  let str=buildSvgString(i.raw,{color:color,strokeWidth:i.strokeWidth||null,w:w,h:h,defaultInk:getComputedInk()});
  return str||`<svg width="${w}" height="${h}" viewBox="0 0 24 24" fill="none" stroke="#BE4429" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 12h6M12 9v6"/></svg>`
}

function escAttr(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;')}

    let str=buildSvgString(i.raw,{color:userColor,strokeWidth:useSW,w:s,h:s,defaultInk:getComputedInk()});
    return'<div class="szitem"><i>'+str+'</i><span>'+s+'px</span></div>'
  }).join('')
}

/* ========== upload ========== */
function parseIcon(svgStr,fileName){
  let el=SVGI.parse(svgStr);if(!el){toast('无法解析 SVG，请检查格式','err');return}
  let name=fileName?fileName.replace(/\.svg$/i,''):'';
  let sw=SVGI.defaultStrokeWidth(el);
  icons.unshift({id:generateId(),name:name||'未命名',raw:svgStr,cat:'',tags:[],fav:false,ts:Date.now(),color:'currentColor',strokeWidth:sw,type:'svg'});
  saveIcons();renderAll();
  if(!name)toast('已导入，请在待整理区设置名称')
  else toast('已导入：'+name)
}

function handleFiles(files){
  for(let f of files){
    if(f.name.endsWith('.svg')){SVGI.parseFile(f).then(t=>{parseIcon(t,f.name)}).catch(()=>toast('读取失败: '+f.name,'err'))}
    else if(f.name.match(/\.(png|jpe?g)$/i)){
      let r=new FileReader();r.onload=()=>{
        let img=new Image();img.onload=()=>{let c=document.createElement('canvas');let w=img.width,h=img.height;if(w>800){h*=800/w;w=800}
          c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);
          let dataUrl=c.toDataURL('image/png');
          icons.unshift({id:generateId(),name:f.name.replace(/\.\w+$/,''),raw:dataUrl,cat:'',tags:[],fav:false,ts:Date.now(),type:'raster'});
          saveIcons();renderAll();toast('已导入: '+f.name)
        };img.src=r.result
      };r.readAsDataURL(f)
    }else{toast('不支持的文件类型: '+f.name,'err')}
  }
}

/* ========== share ========== */
function openShare(id){shareId=id;document.getElementById('shtabs').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b.dataset.tab==='svg'));updateTabInk();renderShareCode();document.getElementById('shModal').classList.add('on')}
function closeShare(){document.getElementById('shModal').classList.remove('on');shareId=null}
function renderShareCode(){
  let i=icons.find(x=>x.id===shareId);if(!i)return;
  let atab=document.getElementById('shtabs').querySelector('.on');let tab=atab?atab.dataset.tab:'svg';
  let str=buildSvgStringForExport(i.raw,{color:i.color||null,strokeWidth:i.strokeWidth||null});
  if(!str){document.getElementById('shcode').textContent='无法解析此图标';return}
  let url=SVGI.toDataURL(str);
  let code='';
  if(tab==='svg')code=str;
  else if(tab==='dataurl')code=url;
  else if(tab==='css')code='background-image: url("'+url.replace(/"/g,'\\"')+'");';
  else if(tab==='react')code='const '+((i.name||'icon').replace(/[^a-zA-Z0-9]/g,'_'))+' = () => (\n  '+str.replace(/</g,'&lt;').replace(/>/g,'&gt;')+'\n);';
  else if(tab==='html')code='<img src="'+url+'" alt="'+(i.name||'icon')+'" />';
  document.getElementById('shcode').textContent=code
}
function updateTabInk(){let ab=document.getElementById('shtabs').querySelector('.on');let ink=document.querySelector('#shtabs .ink');
  if(ab){ink.style.transform='translateX('+ab.offsetLeft+'px)';ink.style.width=ab.offsetWidth+'px'}}

/* ========== download ========== */
function downloadIcon(id){
  let i=icons.find(x=>x.id===id);if(!i)return;
  if(i.type==='raster'){downloadFile(i.raw,(i.name||'icon')+'.png','image/png');return}
  let str=buildSvgStringForExport(i.raw,{color:i.color||null,strokeWidth:i.strokeWidth||null});
  if(!str){toast('无法解析此图标','err');return}
  downloadFile(str,(i.name||'icon')+'.svg','image/svg+xml')
}
function downloadPNG(id){
  let i=icons.find(x=>x.id===id);if(!i)return;
  if(i.type==='raster'){downloadFile(i.raw,(i.name||'icon')+'.png','image/png');return}
  let color=i.color||'#1A1917';
  if(color==='currentColor')color=getComputedInk();
  let str=buildSvgStringForExport(i.raw,{color:color,strokeWidth:i.strokeWidth||null});
  if(!str){toast('无法解析此图标','err');return}
  SVGI.toPNG(str,96,96).then(b=>{let url=URL.createObjectURL(b);let a=document.createElement('a');a.href=url;a.download=(i.name||'icon')+'.png';a.click();URL.revokeObjectURL(url);toast('PNG 已下载')})
}
function downloadFile(content,filename,mime){
  let b=new Blob([content],{type:mime});let url=URL.createObjectURL(b);let a=document.createElement('a');a.href=url;a.download=filename;a.click();URL.revokeObjectURL(url)
}
function copyText(text){navigator.clipboard.writeText(text).then(()=>toast('已复制到剪贴板')).catch(()=>toast('复制失败','err'))}

/* ========== input modal (replaces native prompt) ========== */
let inpResolve=null;
function openInput(title,placeholder,defVal){
  return new Promise((resolve)=>{

    document.getElementById('inpField').placeholder=placeholder||'';
    document.getElementById('inpField').value=defVal||'';
    document.getElementById('inpModal').classList.add('on');

    inpResolve=resolve
  })
}

/* ========== toast / confirm ========== */
function toast(msg,type){
  let ctr=document.getElementById('toasts');
  let el=document.createElement('div');el.className='toast'+(type==='err'?' err':'');
  let icon=type==='err'?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>'
    :type==='ok'?'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke-width="2.2" stroke-linecap="round"><path d="M4 12l5.5 5.5L20 7"/></svg>':'';
  el.innerHTML=icon+'<span>'+esc(msg)+'</span>';
  ctr.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>el.remove(),300)},2200)
}
function cf(msg,onOk){document.getElementById('cfTitle').textContent='确认操作';document.getElementById('cfBody').textContent=msg;document.getElementById('cfModal').classList.add('on');cfResolve=onOk}
function cfHide(){document.getElementById('cfModal').classList.remove('on');cfResolve=null}

/* ========== event delegation ========== */
document.getElementById('grid').addEventListener('click',e=>{
  let card=e.target.closest('.card');if(!card)return;
  let id=card.dataset.id, act=(e.target.closest('[data-action]')||{}).dataset.action;
  if(!act)return;
  e.preventDefault();
  if(act==='sel'){selected.has(id)?selected.delete(id):selected.add(id);card.classList.toggle('sel',selected.has(id));updateSelbar()}
  else if(act==='edit'){openDrawer(id)}
  else if(act==='dl'){downloadIcon(id)}
  else if(act==='share'){openShare(id)}
  else if(act==='fav'){let i=icons.find(x=>x.id===id);if(i){i.fav=!i.fav;card.querySelector('.fav').classList.toggle('on',i.fav);saveIcons();renderAll()}}
});
document.getElementById('grid').addEventListener('dblclick',e=>{
  let card=e.target.closest('.card');if(!card)return;openDrawer(card.dataset.id)
});

/* category chips */
document.getElementById('cats').addEventListener('click',e=>{
  // Delete button on a user category
  let del=e.target.closest('.chip-del');if(del){e.stopPropagation();deleteCategory(del.dataset.delcat);return}
  // Add category button
  if(e.target.closest('.addcat')){e.stopPropagation();addCategory();return}
  // Regular chip
  let chip=e.target.closest('.chip');if(!chip)return;currentCat=chip.dataset.cat;renderAll()
});

function addCategory(){
  openInput('新增分类','输入分类名称').then(name=>{
    if(!name)return;
    if(userCats.includes(name)||DEFAULT_CATS.includes(name)||name==='未分类'){toast('分类已存在','err');return}
    userCats.push(name);
    saveIcons();renderAll();toast('已添加分类：'+name)
  })
}
function deleteCategory(name){
  let used=icons.some(i=>i.cat===name);
  if(used){toast('有 '+icons.filter(i=>i.cat===name).length+' 个图标在使用此分类，请先移走','err');return}
  cf('确定删除分类「'+name+'」？',()=>{
    userCats=userCats.filter(c=>c!==name);
    if(currentCat===name)currentCat='全部图标';
    saveIcons();renderAll();toast('已删除分类：'+name)
  })
}

    str=str.replace(/^<svg([^>]*)>/,function(_,attrs){

    });
    return str
  }).filter(Boolean);
  let sprite='<svg xmlns="http://www.w3.org/2000/svg" style="display:none">\n<defs>\n'+parts.join('\n')+'\n</defs>\n</svg>';
